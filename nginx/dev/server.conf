upstream back {
    ip_hash;
    server app:8000;
}

; upstream front {
;     ip_hash;
;     server frontend:3000;
; }

upstream grafana {
    ip_hash;
    server grafana:3000;
}

server {
    listen 80 default_server;
    server_name dev.oy-pro.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name grafana.dev.oy-pro.ru;

    ssl_certificate /etc/letsencrypt/live/dev.oy-pro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.oy-pro.ru/privkey.pem;

    location / {
        proxy_pass http://grafana/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}

server {
    # listen 80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    client_max_body_size 100M;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_read_timeout 600s;

    server_name dev.oy-pro.ru;

    ssl_certificate /etc/letsencrypt/live/dev.oy-pro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.oy-pro.ru/privkey.pem;

    location /backend/ {
        proxy_pass http://back/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location /grafana/ {
       proxy_set_header Host $host;
       proxy_pass http://grafana/;
    }

;     location / {
;         proxy_pass http://front;
;         proxy_set_header X-Real-IP $remote_addr;
;         proxy_set_header Host $http_host;
;         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
;         proxy_redirect off;
;     }
    location / {
      root /etc/nginx/front/public;
      index index.html index.htm;
      try_files $uri $uri/ /index.html;
    }



    location /.well-known/acme-challenge {
        root /var/www/html;
    }

}
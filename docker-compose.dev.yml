version: '3.9'

services:
  backend:
    restart: unless-stopped
    command: python3 main.py
    env_file: ./app/.env.dev
    build:
      context: app
      dockerfile: Dockerfile
    depends_on:
      - database
    volumes:
      - ./logs:/app/logs
    expose:
      - 8000
    ports:
      - "8000:8000"

  frontend:
    restart: unless-stopped
    env_file: ./front/.env.dev
    build:
      context: front
      dockerfile: front.dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./front/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/dev:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/html:/var/www/html
      - ./certs:/etc/nginx/ssl
    ports:
      - 80:80
      - 443:443

  database:
    restart: unless-stopped
    image: postgres:17.0
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_ROOT_USER}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - "5432:5432"

volumes:
  db-data:
  caddy_data:
  caddy_config:
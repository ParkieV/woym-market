version: '3.9'

services:
  app:
    container_name: app
    restart: unless-stopped
    command: python3 main.py
    env_file: ./app/.env.dev
    build:
      context: ./app
      dockerfile: app.dockerfile
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
    expose:
      - 8000
    ports:
      - "8000:8000"

  frontend:
    container_name: frontend
    restart: unless-stopped
    env_file: front/.env.dev
    build:
      context: front
      dockerfile: front.dockerfile
    depends_on:
      - app
    expose:
      - 3000

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx/dev:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/html:/var/www/html
      # - ./static:/etc/nginx/static_img
    ports:
      - 80:80
      - 443:443

  db:
    restart: unless-stopped
    image: postgres:17.0
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_ROOT_USER}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - "5432:5432"

volumes:
  db-data: